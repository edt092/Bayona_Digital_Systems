[build]
  command = "pnpm install && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # En modo report-only hasta revisar la consola en producción; después renombrar a Content-Security-Policy
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Recursos con hash en el nombre (CSS, JS, imágenes optimizadas, fuentes): inmutables
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# Caso retirado: no tenía contenido ni resultados verificables
[[redirects]]
  from = "/proyectos/clinica-dental"
  to = "/proyectos/"
  status = 301
  force = true

[[redirects]]
  from = "/proyectos/clinica-dental/"
  to = "/proyectos/"
  status = 301
  force = true

# Caso en construcción: redirección temporal hasta que vuelva a publicarse
[[redirects]]
  from = "/proyectos/contratadata"
  to = "/proyectos/"
  status = 302
  force = true

[[redirects]]
  from = "/proyectos/contratadata/"
  to = "/proyectos/"
  status = 302
  force = true
